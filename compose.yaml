services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: slak
      POSTGRES_USER: slak
      POSTGRES_PASSWORD: slak_local
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - slak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slak -d slak"]
      interval: 2s
      timeout: 3s
      retries: 10
volumes:
  slak_data:
